<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Ultra Effects</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- แสงไฟวิ่งตามเมาส์ (Mouse Follower Light) -->
    <div class="cursor-glow" id="cursor-glow"></div>
    <!-- จุดเมาส์ + วงแหวนตามเมาส์ -->
    <div class="cursor-dot" id="cursor-dot"></div>
    <div class="cursor-outline" id="cursor-outline"></div>

    <!-- Particles พื้นหลัง -->
    <div id="particles-js"></div>

    <div class="main-wrapper">
        <!-- เพิ่ม attribute data-tilt สำหรับเอฟเฟกต์การ์ดเอียง 3D -->
        <div class="outer-border animate__appear" id="tilt-card">
            <div class="card animate__slideUp">
                <img src="yourname.jpg" alt="Profile Picture" class="avatar">
                
                <p class="sub-tag animate__fadeIn glow-text">Minecraft Rov Pubg Freefire</p>
                
                <h1 class="name animate__fadeIn glitch-text">Suwaphat<br>Kaewboonsri</h1>
                
                <div class="info animate__fadeIn">
                    <p>age–15</p>
                    <p>birthday–11 March 2009</p>
                </div>
            </div>

<div class="socials animate__slideUpDelay">
    <!-- Discord (ใส่เป็นลิงก์คำชวนเข้าเซิร์ฟเวอร์ หรือโปรไฟล์) -->
    <a href="https://discord.com/users/1032559564895301634" target="_blank" class="hvr-pulse"><i class="fa-brands fa-discord"></i></a>
    
    <!-- Facebook -->
    <a href="https://www.facebook.com/suwaphat.kaewboonsri/" target="_blank" class="hvr-pulse"><i class="fa-brands fa-facebook"></i></a>
    
    <!-- Instagram -->
    <a href="https://instagram.com/yourusername" target="_blank" class="hvr-pulse"><i class="fa-brands fa-instagram"></i></a>
    
    <!-- X (Twitter) -->
    <a href="https://x.com/yourusername" target="_blank" class="hvr-pulse"><i class="fa-brands fa-x-twitter"></i></a>
    
    <!-- Roblox -->
    <a href="https://www.roblox.com/users/4151017282/profile" target="_blank" class="hvr-pulse">
    <img src="https://cdn.simpleicons.org/roblox/ffffff" alt="Roblox" style="width: 1.1rem; height: 1.1rem; vertical-align: middle;"></a>
    
    <!-- YouTube -->
    <a href="https://youtube.com/@yourchannel" target="_blank" class="hvr-pulse"><i class="fa-brands fa-youtube"></i></a>
    
    <!-- Bilibili / อื่นๆ -->
    <a href="https://space.bilibili.com/yourid" target="_blank" class="hvr-pulse"><i class="fa-solid fa-tv"></i></a>
</div>

            <p class="footer-text animate__fadeIn">( Made with TawanKub )</p>
        </div>
    </div>

<div class="theme-switchers">
    <span class="dot-btn purple" onclick="changeTheme('#b388ff', '#38bdf8')"></span>
    <span class="dot-btn cyan" onclick="changeTheme('#38bdf8', '#00ffcc')"></span>
    <span class="dot-btn green" onclick="changeTheme('#00ffcc', '#b388ff')"></span>
</div>

    <!-- Scripts สำหรับระบบ Particles, 3D Tilt และ Cursor Effects -->
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script>
    
    <script>
        // 1. ตั้งค่า Particles พื้นหลัง
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 100, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": ["#b388ff", "#38bdf8", "#ffffff"] },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.4, "random": true },
                "size": { "value": 3.5, "random": true },
                "line_linked": { "enable": true, "distance": 130, "color": "#b388ff", "opacity": 0.2, "width": 1 },
                "move": { "enable": true, "speed": 1.8, "direction": "none", "random": true, "straight": false, "out_mode": "out", "bounce": false }
            },
            "interactivity": {
                "detect_on": "window",
                "events": { "onhover": { "enable": true, "mode": "grab" }, "onclick": { "enable": true, "mode": "push" } },
                "modes": { "grab": { "distance": 180, "line_linked": { "opacity": 0.6 } } }
            },
            "retina_detect": true
        });

        // 2. ระบบ Custom Cursor & Mouse Follower Light
        const dot = document.getElementById("cursor-dot");
        const outline = document.getElementById("cursor-outline");
        const glow = document.getElementById("cursor-glow");

        window.addEventListener("mousemove", (e) => {
            const posX = e.clientX;
            const posY = e.clientY;

            // จุดกลางเมาส์ขยับทันที
            dot.style.left = `${posX}px`;
            dot.style.top = `${posY}px`;

            // วงแหวนและแสงเรืองขยับตามแบบลื่นๆ (Smooth Transition)
            outline.animate({ left: `${posX}px`, top: `${posY}px` }, { duration: 250, fill: "forwards" });
            glow.animate({ left: `${posX}px`, top: `${posY}px` }, { duration: 1200, fill: "forwards" });
        });

        // 3. ระบบ 3D Card Tilt (การ์ดเอียงตามเมาส์)
        VanillaTilt.init(document.querySelector("#tilt-card"), {
            max: 12,
            speed: 400,
            glare: true,
            "max-glare": 0.2,
        });
    </script>

</body>
</html>
